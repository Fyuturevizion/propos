name: Rollback Worker (WN Luxe)

on:
  workflow_dispatch:
    inputs:
      steps:
        description: How many Worker versions to roll back (default 1)
        required: false
        default: "1"
  push:
    branches: [main]

jobs:
  rollback:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[rollback-worker]')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Roll back wnluxe Worker
        run: |
          STEPS="${{ github.event.inputs.steps }}"
          if [ -z "$STEPS" ]; then
            MSG="${{ github.event.head_commit.message }}"
            if [[ "$MSG" =~ steps=([0-9]+) ]]; then
              STEPS="${BASH_REMATCH[1]}"
            else
              STEPS=1
            fi
          fi
          echo "Rolling back ${STEPS} version(s) on Worker wnluxe"
          for i in $(seq 1 "$STEPS"); do
            npx wrangler rollback --name wnluxe --yes
          done
