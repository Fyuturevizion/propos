name: Deploy production (WN Luxe)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-wnluxe-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_BRAND_ID: wnluxe
      NEXT_PUBLIC_APP_URL: https://wnluxe.com
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Sync Worker runtime secrets (from GitHub Secrets)
        run: bash scripts/cloudflare-sync-worker-secrets.sh

      - name: Build and deploy to Cloudflare Workers (wnluxe)
        run: npm run deploy:cloudflare

      - name: Verify discovery endpoints
        run: |
          sleep 15
          for path in /robots.txt /llms.txt /en; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://wnluxe.com${path}")
            echo "${path} -> ${code}"
            if [ "$path" != "/en" ] && [ "$code" = "404" ]; then
              echo "Warning: ${path} returned 404 after deploy"
            fi
          done
