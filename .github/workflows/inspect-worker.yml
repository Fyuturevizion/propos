name: Inspect Worker version (WN Luxe)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Worker version id
        required: true
  push:
    branches: [main]

jobs:
  inspect:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[inspect-worker')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INPUT_VERSION: ${{ github.event.inputs.version }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
    steps:
      - name: Download version metadata and script content
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ] && [[ "$COMMIT_MSG" =~ version=([0-9a-f-]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          fi
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/wnluxe"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          mkdir -p out
          curl -sS -H "$AUTH" "${BASE}/versions/${VERSION}" > out/version.json
          jq '{id: .result.id, metadata: .result.metadata, main_module: .result.resources.script.etag, script: .result.resources.script, runtime: .result.resources.script_runtime, bindings: [.result.resources.bindings[]? | {name, type}]}' out/version.json || head -c 2000 out/version.json
          curl -sS -H "$AUTH" -D out/headers.txt "${BASE}/content/v2?version=${VERSION}" -o out/content.bin
          cat out/headers.txt
          ls -la out
          file out/content.bin || true
          strings out/content.bin | grep -Eo '(/Users|/home)/[A-Za-z0-9._/-]{3,120}' | sort | uniq -c | sort -rn | head -40 || true
          strings out/content.bin | grep -Eo '"name":"[a-z0-9@/._-]{2,60}","version":"[0-9.]+"' | sort -u | head -20 || true
          strings out/content.bin | grep -Eio 'github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' | sort | uniq -c | sort -rn | head -20 || true
      - uses: actions/upload-artifact@v4
        with:
          name: worker-version
          path: out/
          retention-days: 7
