name: Inspect Worker version (WN Luxe)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Worker version id
        required: true
  push:
    branches: [main]

jobs:
  inspect:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[inspect-worker')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INPUT_VERSION: ${{ github.event.inputs.version }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
    steps:
      - name: Download version metadata and script content
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ] && [[ "$COMMIT_MSG" =~ version=([0-9a-f-]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          fi
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/wnluxe"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          mkdir -p out
          curl -sS -H "$AUTH" "${BASE}/versions/${VERSION}" > out/version.json
          jq '{id: .result.id, metadata: .result.metadata, main_module: .result.resources.script.etag, script: .result.resources.script, runtime: .result.resources.script_runtime, bindings: [.result.resources.bindings[]? | {name, type}]}' out/version.json || head -c 2000 out/version.json
          if [[ "$COMMIT_MSG" =~ bindings-only ]]; then exit 0; fi
          # Versioned module content (Workers API); content/v2 always returns the latest upload.
          WBASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/workers/wnluxe/versions/${VERSION}"
          curl -sS -H "$AUTH" "${WBASE}?include=modules" > out/modules.json
          jq '{success, errors, modules: [.result.modules[]? | {name, content_type, bytes: (.content_base64 | length)}]}' out/modules.json || head -c 1500 out/modules.json
          mkdir -p out/modules
          jq -r '.result.modules[]? | @base64' out/modules.json | while read -r row; do
            name=$(echo "$row" | base64 -d | jq -r .name)
            echo "$row" | base64 -d | jq -r .content_base64 | base64 -d > "out/modules/$(echo "$name" | tr '/' '_')"
          done
          ls -la out/modules
          grep -c 'Property Listings sheet' out/modules/* || true
      - uses: actions/upload-artifact@v4
        with:
          name: worker-version
          path: out/
          retention-days: 7
